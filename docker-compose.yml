services:
  database:
    profiles: [legacy]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: bookuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookuser -d bookstore"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [bookstore-net]
    restart: unless-stopped

  catalog-database:
    # The schema is created by the catalog service's Flyway migrations, so the
    # containers start empty on purpose: this path is exercised by CI.
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalogdb
      POSTGRES_USER: cataloguser
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-local-catalog-only-change-me}
    volumes:
      - catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cataloguser -d catalogdb"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [bookstore-net]
    restart: unless-stopped

  backend:
    profiles: [legacy]
    build: ./backend
    image: bookstore-backend:local
    environment:
      NODE_ENV: production
      PORT: "5000"
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: bookstore
      DB_USER: bookuser
      DB_PASSWORD: ${DB_PASSWORD:-local-only-change-me}
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [bookstore-net]
    restart: unless-stopped

  orders-database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ordersdb
      POSTGRES_USER: serviceuser
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:-local-orders-change-me}
    volumes:
      - orders_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serviceuser -d ordersdb"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [bookstore-net]
    restart: unless-stopped

  inventory-database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: serviceuser
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-local-inventory-change-me}
    volumes:
      - inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serviceuser -d inventorydb"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [bookstore-net]
    restart: unless-stopped

  orders-service:
    build:
      context: .
      dockerfile: services/orders-service/Dockerfile
    image: bookstore-orders-service:local
    environment:
      SERVER_PORT: "8082"
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      # Used only when PAYMENTS_ENABLED=true, to price the order server-side.
      CATALOG_SERVICE_URL: http://catalog-service:8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://orders-database:5432/ordersdb
      SPRING_DATASOURCE_USERNAME: serviceuser
      SPRING_DATASOURCE_PASSWORD: ${ORDERS_DB_PASSWORD:-local-orders-change-me}
    ports:
      - "${ORDERS_PORT:-8082}:8082"
    depends_on:
      orders-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 25s
    networks: [bookstore-net]
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    image: bookstore-inventory-service:local
    environment:
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-database:5432/inventorydb
      SPRING_DATASOURCE_USERNAME: serviceuser
      SPRING_DATASOURCE_PASSWORD: ${INVENTORY_DB_PASSWORD:-local-inventory-change-me}
    ports:
      - "${INVENTORY_PORT:-8083}:8083"
    depends_on:
      inventory-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/actuator/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 25s
    networks: [bookstore-net]
    restart: unless-stopped

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    image: bookstore-catalog-service:local
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-database:5432/catalogdb
      SPRING_DATASOURCE_USERNAME: cataloguser
      SPRING_DATASOURCE_PASSWORD: ${CATALOG_DB_PASSWORD:-local-catalog-only-change-me}
    ports:
      - "${CATALOG_PORT:-8081}:8081"
    depends_on:
      catalog-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 25s
    networks: [bookstore-net]
    restart: unless-stopped

  # Optional local identity provider for testing JWT authorization.
  # `docker compose --profile auth up -d` (or `make auth`).
  keycloak:
    profiles: [auth]
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8090", "--hostname-strict=false"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-keycloak-admin}
    volumes:
      - ./deploy/local/auth/bookstore-realm.json:/opt/keycloak/data/import/bookstore-realm.json:ro
    ports:
      - "8090:8090"
    networks: [bookstore-net]
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: bookstore-frontend:local
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      catalog-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    networks: [bookstore-net]
    restart: unless-stopped

networks:
  bookstore-net:
    driver: bridge

volumes:
  postgres_data:
  catalog_data:
  orders_data:
  inventory_data:
