services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: bookuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookuser -d bookstore"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [bookstore-net]
    restart: unless-stopped

  backend:
    build: ./backend
    image: bookstore-backend:local
    environment:
      NODE_ENV: production
      PORT: "5000"
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: bookstore
      DB_USER: bookuser
      DB_PASSWORD: ${DB_PASSWORD:-local-only-change-me}
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [bookstore-net]
    restart: unless-stopped

  catalog-service:
    build: ./services/catalog-service
    image: bookstore-catalog-service:local
    environment:
      SERVER_PORT: "8081"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks: [bookstore-net]
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: bookstore-frontend:local
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [bookstore-net]
    restart: unless-stopped

networks:
  bookstore-net:
    driver: bridge

volumes:
  postgres_data:
