sonar.projectKey=bookstore-3tier
sonar.projectName=Bookstore DevOps Platform
sonar.sourceEncoding=UTF-8
sonar.sources=backend/src,frontend/src,services/catalog-service/src/main/java,services/orders-service/src/main/java,services/inventory-service/src/main/java
sonar.tests=backend/test,services/catalog-service/src/test/java,services/orders-service/src/test/java,services/inventory-service/src/test/java
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/target/**
sonar.java.binaries=services/catalog-service/target/classes,services/orders-service/target/classes,services/inventory-service/target/classes

sonar.coverage.jacoco.xmlReportPaths=services/catalog-service/target/site/jacoco/jacoco.xml,services/orders-service/target/site/jacoco/jacoco.xml,services/inventory-service/target/site/jacoco/jacoco.xml
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
