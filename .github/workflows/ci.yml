name: Bookstore CI

on:
  pull_request:
    branches: [main, feature/devops-platform-foundation]
  push:
    branches: [main, feature/devops-platform-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bookstore-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate catalog service
        working-directory: services/catalog-service
        run: |
          for attempt in 1 2 3; do
            mvn -B -ntp -U verify && exit 0
            echo "Maven attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Validate orders service
        working-directory: services/orders-service
        run: |
          for attempt in 1 2 3; do
            mvn -B -ntp -U verify && exit 0
            echo "Maven attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Validate inventory service
        working-directory: services/inventory-service
        run: |
          for attempt in 1 2 3; do
            mvn -B -ntp -U verify && exit 0
            echo "Maven attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint and render Helm charts
        run: |
          helm lint ./helm/bookstore
          helm template bookstore ./helm/bookstore --namespace bookstore > /tmp/bookstore-rendered.yaml
          test -s /tmp/bookstore-rendered.yaml
          helm lint ./helm/catalog-service
          helm template catalog-service ./helm/catalog-service --namespace bookstore > /tmp/catalog-rendered.yaml
          test -s /tmp/catalog-rendered.yaml
          helm lint ./helm/orders-service
          helm template orders-service ./helm/orders-service --namespace bookstore > /tmp/orders-rendered.yaml
          test -s /tmp/orders-rendered.yaml
          helm lint ./helm/inventory-service
          helm template inventory-service ./helm/inventory-service --namespace bookstore > /tmp/inventory-rendered.yaml
          test -s /tmp/inventory-rendered.yaml

      - name: Build and start stack
        run: docker compose up --build -d

      - name: Wait for services and smoke test
        run: |
          set -eu
          for service_port in 8081 8082 8083; do
            for attempt in $(seq 1 40); do
              if curl --fail --silent "http://localhost:${service_port}/actuator/health/readiness" | grep -q '"status":"UP"'; then
                echo "port ${service_port} ready"
                break
              fi
              if [ "$attempt" -eq 40 ]; then
                docker compose logs
                exit 1
              fi
              sleep 3
            done
          done

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080/nginx-health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker compose logs
              exit 1
            fi
            sleep 3
          done

          curl --fail --silent http://localhost:8080/api/catalog/books | grep -q "DevOps for Beginners"
          curl --fail --silent http://localhost:8080/api/inventory | grep -q "availableQuantity"
          curl --fail --silent http://localhost:8080/api/orders | grep -q "CREATED"

          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/unknown-path)
          test "$code" = "404"

          BOOK_ID=$(curl -s http://localhost:8080/api/inventory | jq -r '.[0].bookId')
          BEFORE=$(curl -s "http://localhost:8080/api/inventory/$BOOK_ID" | jq -r '.availableQuantity')
          curl -s -X POST http://localhost:8080/api/orders \
            -H 'Content-Type: application/json' \
            -d "{\"customerName\":\"CITest\",\"bookId\":$BOOK_ID,\"quantity\":1}" > /dev/null
          AFTER=$(curl -s "http://localhost:8080/api/inventory/$BOOK_ID" | jq -r '.availableQuantity')
          test "$AFTER" -eq "$((BEFORE - 1))"

          echo "ALL SMOKE TESTS PASSED"

      - name: Print diagnostic logs on failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans || true

  terraform-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform/eks

      - name: Initialize Terraform
        working-directory: terraform/eks
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        working-directory: terraform/eks
        run: terraform validate
