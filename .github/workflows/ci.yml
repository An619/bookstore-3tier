name: Bookstore CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bookstore-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Set up Java for Maven catalog service
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/catalog-service/pom.xml

      - name: Validate Maven catalog service
        run: mvn -B -f services/catalog-service/pom.xml clean verify

      - name: Validate backend
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint and render Helm chart
        run: |
          helm lint ./helm/bookstore
          helm template bookstore ./helm/bookstore --namespace bookstore > /tmp/bookstore-rendered.yaml
          test -s /tmp/bookstore-rendered.yaml

      - name: Build and start three-tier stack
        run: docker compose up --build -d

      - name: Smoke test API and frontend proxy
        run: |
          set -eu
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5000/api/ready; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose logs
              exit 1
            fi
            sleep 3
          done
          curl --fail --silent http://localhost:5000/api/books | grep -q "DevOps for Beginners"
          curl --fail --silent http://localhost:8080/ > /dev/null
          curl --fail --silent http://localhost:8080/api/books | grep -q "Kubernetes Basics"
          curl --fail --silent http://localhost:8081/api/health | grep -q "catalog-service"
          curl --fail --silent http://localhost:8081/api/catalog/books | grep -q "DevOps for Beginners"

      - name: Print diagnostic logs on failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans || true

  terraform-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform/eks

      - name: Initialize Terraform without a backend
        working-directory: terraform/eks
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        working-directory: terraform/eks
        run: terraform validate
