{{- if .Values.database.createSecret }}
# LAB ONLY: creates the database credentials from chart values. Prefer an
# externally managed Secret (database.createSecret=false) for shared clusters.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.database.secretName }}
type: Opaque
stringData:
  username: {{ .Values.database.username | quote }}
  password: {{ required "database.password is required when database.createSecret is true" .Values.database.password | quote }}
{{- end }}
