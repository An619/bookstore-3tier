replicaCount: 1
image:
  repository: bookstore-inventory-service
  tag: local
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8083
database:
  host: inventory-service-postgres
  port: 5432
  name: inventorydb
  username: serviceuser
  password: local-inventory-change-me
  existingSecret: ""
  secretName: ""
  storage: 1Gi
  image: postgres:16-alpine
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
