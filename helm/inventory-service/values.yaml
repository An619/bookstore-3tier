replicaCount: 1
image:
  repository: bookstore-inventory-service
  tag: local
  pullPolicy: IfNotPresent
service:
  port: 8083
database:
  # LAB ONLY: set createSecret=true to let this chart create the credential
  # Secret. Shared clusters should use an externally managed Secret instead.
  createSecret: false
  password: ""
  host: inventory-service-postgres
  name: inventorydb
  username: serviceuser
  secretName: inventory-db-secret
  storage: 5Gi
  image: postgres:16-alpine

imagePullSecrets: []
networkPolicy:
  enabled: false
  # Optional: namespace allowed to scrape /actuator/prometheus (e.g. monitoring).
  metricsNamespace: ""
serviceMonitor:
  enabled: false
  interval: 30s
  # Must match your Prometheus resource's serviceMonitorSelector labels.
  labels:
    release: kube-prometheus-stack
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
