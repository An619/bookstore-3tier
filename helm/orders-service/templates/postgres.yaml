{{- if .Values.database.deploy }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-db-init
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS customer_orders (id BIGSERIAL PRIMARY KEY, customer_name VARCHAR(160) NOT NULL, book_id BIGINT NOT NULL, quantity INTEGER NOT NULL, status VARCHAR(32) NOT NULL);
    CREATE TABLE IF NOT EXISTS checkout_attempts (idempotency_key VARCHAR(64) PRIMARY KEY, order_id BIGINT, status VARCHAR(32) NOT NULL, response_status INTEGER NOT NULL, message VARCHAR(200));
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.database.host }}
spec:
  selector:
    app: {{ .Release.Name }}-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  serviceName: {{ .Values.database.host }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-postgres
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.database.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/01-init.sql
              subPath: init.sql
      volumes:
        - name: init-sql
          configMap:
            name: {{ .Release.Name }}-db-init
        {{- if not .Values.database.persistence.enabled }}
        # storage-mode: ephemeral
        # No volume, so no CSI driver or StorageClass is needed. Data is lost
        # whenever this pod is replaced; use for demos only.
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.database.persistence.enabled }}
  # storage-mode: persistent
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.database.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.storage }}
  {{- end }}
{{- end }}
