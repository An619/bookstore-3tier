{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: orders-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: bookstore-frontend}
      ports: [{port: 8082}]
    {{- if .Values.networkPolicy.metricsNamespace }}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.networkPolicy.metricsNamespace }}}
      ports: [{port: 8082}]
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}-postgres
      ports: [{port: 5432}]
    # Server-side checkout calls the inventory service.
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: inventory-service}
      ports: [{port: 8083}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-database
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-postgres
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: orders-service
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports: [{port: 5432}]
  egress: []
{{- end }}
