apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-service
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orders-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: SERVER_PORT
              value: "8082"
            # Distributed tracing: OTLP/HTTP export, sampling default 0 (off).
            {{- if .Values.observability.tracing.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.tracing.endpoint | quote }}
            {{- end }}
            - name: OTEL_SAMPLING_PROBABILITY
              value: {{ .Values.observability.tracing.samplingProbability | quote }}
            # JWT authorization. Disabled by default so the lab works without an
            # identity provider; enabling it requires an issuer or JWKS URI.
            {{- if .Values.security.jwt.enabled }}
            - name: SECURITY_JWT_ENABLED
              value: "true"
            {{- if .Values.security.jwt.issuerUri }}
            - name: SECURITY_JWT_ISSUER_URI
              value: {{ .Values.security.jwt.issuerUri | quote }}
            {{- end }}
            {{- if .Values.security.jwt.jwkSetUri }}
            - name: SECURITY_JWT_JWK_SET_URI
              value: {{ .Values.security.jwt.jwkSetUri | quote }}
            {{- end }}
            {{- end }}
            - name: INVENTORY_SERVICE_URL
              value: {{ .Values.inventory.url | quote }}
            - name: CATALOG_SERVICE_URL
              value: {{ .Values.catalog.url | quote }}
            - name: PAYMENTS_ENABLED
              value: {{ .Values.payments.enabled | quote }}
            - name: PAYMENTS_CURRENCY
              value: {{ .Values.payments.currency | quote }}
            - name: CHECKOUT_WORKER_ENABLED
              value: {{ .Values.checkout.worker.enabled | quote }}
            - name: CHECKOUT_WORKER_DELAY_MS
              value: {{ .Values.checkout.worker.delayMs | quote }}
            - name: CHECKOUT_WORKER_MAX_ATTEMPTS
              value: {{ .Values.checkout.worker.maxAttempts | quote }}
            - name: CHECKOUT_RECONCILER_ENABLED
              value: {{ .Values.checkout.reconciler.enabled | quote }}
            - name: CHECKOUT_RECONCILER_DELAY_MS
              value: {{ .Values.checkout.reconciler.delayMs | quote }}
            - name: CHECKOUT_RECONCILER_MAX_CYCLES
              value: {{ .Values.checkout.reconciler.maxCycles | quote }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Values.database.host }}:5432/{{ .Values.database.name }}{{ if .Values.database.sslmode }}?sslmode={{ .Values.database.sslmode }}{{ end }}"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: password
            # Managed PostgreSQL in production: TLS and a bounded pool.
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: {{ .Values.database.hikari.maximumPoolSize | quote }}
            - name: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
              value: {{ .Values.database.hikari.connectionTimeoutMs | quote }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 25
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
