replicaCount: 1
image:
  repository: bookstore-orders-service
  tag: local
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8082
database:
  host: orders-service-postgres
  port: 5432
  name: ordersdb
  username: serviceuser
  password: local-orders-change-me
  existingSecret: ""
  secretName: ""
  storage: 1Gi
  image: postgres:16-alpine
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
