replicaCount: 1
image:
  repository: bookstore-catalog-service
  tag: local
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8081
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
