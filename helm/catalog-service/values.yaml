replicaCount: 1
image:
  repository: bookstore-catalog-service
  tag: local
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8081
database:
  deploy: true
  host: catalog-service-postgres
  port: 5432
  name: catalogdb
  username: cataloguser
  existingSecret: catalog-db-secret
  storage: 5Gi
  image: postgres:16-alpine
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
