{{- if and .Values.backup.enabled .Values.database.deploy }}
# Restorable backups, not just dumps: the job writes a compressed pg_dump and
# then restores it into a throwaway database, so a broken backup fails here
# instead of during an incident. Set backup.s3.bucket to copy it off-cluster.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup
  labels:
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: catalog-service-backup
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: {{ if .Values.backup.s3.bucket }}true{{ else }}false{{ end }}
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              image: {{ .Values.database.image }}
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  target="/backup/${PGDATABASE}-${stamp}.sql.gz"
                  echo "dumping ${PGDATABASE} to ${target}"
                  pg_dump --no-owner --no-privileges | gzip -9 > "$target"
                  ls -l "$target"
                  gunzip -t "$target"
                  # Prove the archive restores, into a scratch database on this server.
                  scratch="restore_test_$(date -u +%s)"
                  createdb "$scratch"
                  trap 'dropdb --if-exists "$scratch" || true' EXIT
                  gunzip -c "$target" | psql -q -v ON_ERROR_STOP=1 -d "$scratch" >/dev/null
                  rows=$(psql -tA -d "$scratch" -c 'SELECT count(*) FROM catalog_books')
                  echo "restore verified: catalog_books has ${rows} row(s)"
                  touch /backup/.done
              env:
                - name: PGHOST
                  value: {{ .Values.database.host | quote }}
                - name: PGPORT
                  value: {{ .Values.database.port | default 5432 | quote }}
                - name: PGDATABASE
                  value: {{ .Values.database.name | quote }}
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.database.secretName | default .Values.database.existingSecret }}
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.database.secretName | default .Values.database.existingSecret }}
                      key: password
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backup
                  mountPath: /backup
            {{- if .Values.backup.s3.bucket }}
            - name: upload
              image: {{ .Values.backup.s3.image }}
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  for _ in $(seq 1 300); do [ -f /backup/.done ] && break; sleep 5; done
                  if [ ! -f /backup/.done ]; then echo "the dump never finished" >&2; exit 1; fi
                  for file in /backup/*.sql.gz; do
                    echo "uploading ${file}"
                    aws s3 cp "$file" "s3://{{ .Values.backup.s3.bucket }}/{{ .Values.backup.s3.prefix }}/$(basename "$file")"
                  done
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
            {{- end }}
          volumes:
            - name: backup
              emptyDir:
                sizeLimit: {{ .Values.backup.sizeLimit }}
{{- end }}
