{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bookstore-frontend
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Any source may reach the web port (ingress controller or load balancer).
    - ports:
        - port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: catalog-service}
      ports: [{port: 8081}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: orders-service}
      ports: [{port: 8082}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: inventory-service}
      ports: [{port: 8083}]
{{- end }}
