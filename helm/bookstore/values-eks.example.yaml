# Copy/adapt this file to a reviewed environment values file.
# Replace account, region, image tags and hostname before use.
imagePullPolicy: IfNotPresent

frontend:
  image:
    repository: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/bookstore-lab/frontend
    tag: REPLACE_WITH_COMMIT_SHA

backend:
  image:
    repository: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/bookstore-lab/backend
    tag: REPLACE_WITH_COMMIT_SHA

database:
  # Pre-create this Secret in the bookstore namespace through an approved secret workflow.
  # It must contain username and password keys.
  existingSecret: bookstore-database

ingress:
  enabled: true
  className: alb
  host: bookstore.internal.example
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /nginx-health
    alb.ingress.kubernetes.io/success-codes: "200"
