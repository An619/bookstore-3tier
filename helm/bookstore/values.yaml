nameOverride: ""
fullnameOverride: ""

imagePullPolicy: IfNotPresent

frontend:
  replicaCount: 1
  image:
    repository: bookstore-frontend
    tag: local
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: bookstore.local
  tls: []
