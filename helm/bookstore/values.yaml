nameOverride: ""
fullnameOverride: ""

imagePullPolicy: IfNotPresent

frontend:
  replicaCount: 1
  image:
    repository: bookstore-frontend
    tag: local
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

backend:
  replicaCount: 1
  image:
    repository: bookstore-backend
    tag: local
  service:
    port: 5000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

catalog:
  replicaCount: 1
  image:
    repository: bookstore-catalog
    tag: local
  service:
    port: 8081
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 384Mi

database:
  image: postgres:16-alpine
  name: bookstore
  username: bookuser
  # Local learning default only. For shared environments use existingSecret or a secret manager.
  password: local-only-change-me
  existingSecret: ""
  storageSize: 2Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: bookstore.local
  tls: []
