backend:
  replicaCount: 1
  image:
    repository: an619/bookstore-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 5000

frontend:
  replicaCount: 1
  image:
    repository: an619/bookstore-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 80
    nodePort: 30080

postgres:
  enabled: true
  image: postgres:16-alpine
  database: bookstore
  username: bookuser
  password: bookpass
  service:
    port: 5432
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""

app:
  secretName: bookstore-db
