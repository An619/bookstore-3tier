{{- if and .Values.backend.podDisruptionBudget.enabled (or (gt (int .Values.backend.replicaCount) 1) (and .Values.backend.autoscaling.enabled (gt (int .Values.backend.autoscaling.minReplicas) 1))) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "bookstore.fullname" . }}-backend
  labels:
    {{- include "bookstore.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.backend.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
