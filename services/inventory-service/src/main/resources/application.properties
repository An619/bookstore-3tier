spring.application.name=inventory-service
server.port=${SERVER_PORT:8083}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://inventory-service-postgres:5432/inventorydb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:serviceuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:local-only-change-me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
