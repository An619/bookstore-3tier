spring.application.name=inventory-service
server.port=${SERVER_PORT:8083}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://inventory-service-postgres:5432/inventorydb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:serviceuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:local-only-change-me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
# Distributed tracing (W3C traceparent propagation + OTLP export).
# Sampling defaults to 0 so a lab node exports nothing; set OTEL_SAMPLING_PROBABILITY
# (or observability.tracing.samplingProbability in Helm) to trace real traffic.
management.tracing.enabled=${TRACING_ENABLED:true}
management.tracing.sampling.probability=${OTEL_SAMPLING_PROBABILITY:0.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.tracing.timeout=5s
# No generated in-memory user: access control is defined in SecurityConfig.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# JWT authorization. Disabled for the local lab so `make lab` works out of the
# box; a real environment sets SECURITY_JWT_ENABLED=true plus an issuer or a
# JWKS URI, and clients send `Authorization: Bearer <token>`.
security.jwt.enabled=${SECURITY_JWT_ENABLED:false}
security.jwt.issuer-uri=${SECURITY_JWT_ISSUER_URI:}
security.jwt.jwk-set-uri=${SECURITY_JWT_JWK_SET_URI:}
# Versioned schema migrations. Migrations own the schema; Hibernate only
# validates it. baseline-on-migrate covers databases created from the older
# database/*-init.sql scripts.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
