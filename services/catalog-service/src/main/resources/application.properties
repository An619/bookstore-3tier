spring.application.name=catalog-service
server.port=${SERVER_PORT:8081}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://catalog-database:5432/catalogdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cataloguser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:local-catalog-only-change-me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
