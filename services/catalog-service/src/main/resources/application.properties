spring.application.name=catalog-service
server.port=${SERVER_PORT:8081}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://catalog-database:5432/catalogdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cataloguser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:local-catalog-only-change-me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
# Distributed tracing (W3C traceparent propagation + OTLP export).
# Sampling defaults to 0 so a lab node exports nothing; set OTEL_SAMPLING_PROBABILITY
# (or observability.tracing.samplingProbability in Helm) to trace real traffic.
management.tracing.enabled=${TRACING_ENABLED:true}
management.tracing.sampling.probability=${OTEL_SAMPLING_PROBABILITY:0.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.tracing.timeout=5s
