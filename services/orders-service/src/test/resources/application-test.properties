spring.datasource.url=jdbc:h2:mem:ordersservicetest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
# Tests call CheckoutWorker.processPending() explicitly.
checkout.worker.enabled=false
checkout.worker.max-attempts=3
# Tests call CheckoutReconciler.reconcilePending() explicitly.
checkout.reconciler.enabled=false
checkout.reconciler.max-cycles=2
management.tracing.enabled=false
security.jwt.enabled=false
payments.enabled=false
# Tests build the schema with Hibernate; the migrations run in Compose/K8s.
spring.flyway.enabled=false
