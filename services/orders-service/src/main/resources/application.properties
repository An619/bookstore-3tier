spring.application.name=orders-service
server.port=${SERVER_PORT:8082}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://orders-service-postgres:5432/ordersdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:serviceuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:local-only-change-me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db

# Inventory service used by the checkout outbox worker.
inventory.service.url=${INVENTORY_SERVICE_URL:http://inventory-service:8083}

# Outbox worker: reserves stock asynchronously and retries until it succeeds.
checkout.worker.enabled=${CHECKOUT_WORKER_ENABLED:true}
checkout.worker.delay-ms=${CHECKOUT_WORKER_DELAY_MS:2000}
checkout.worker.max-attempts=${CHECKOUT_WORKER_MAX_ATTEMPTS:5}

# Reconciler: settles checkouts the worker could not confirm, from the inventory
# ledger. It retries a lost reservation at most max-cycles times, then cancels.
checkout.reconciler.enabled=${CHECKOUT_RECONCILER_ENABLED:true}
checkout.reconciler.delay-ms=${CHECKOUT_RECONCILER_DELAY_MS:5000}
checkout.reconciler.max-cycles=${CHECKOUT_RECONCILER_MAX_CYCLES:3}
# Distributed tracing (W3C traceparent propagation + OTLP export).
# Sampling defaults to 0 so a lab node exports nothing; set OTEL_SAMPLING_PROBABILITY
# (or observability.tracing.samplingProbability in Helm) to trace real traffic.
management.tracing.enabled=${TRACING_ENABLED:true}
management.tracing.sampling.probability=${OTEL_SAMPLING_PROBABILITY:0.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.tracing.timeout=5s
# No generated in-memory user: access control is defined in SecurityConfig.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# JWT authorization. Disabled for the local lab so `make lab` works out of the
# box; a real environment sets SECURITY_JWT_ENABLED=true plus an issuer or a
# JWKS URI, and clients send `Authorization: Bearer <token>`.
security.jwt.enabled=${SECURITY_JWT_ENABLED:false}
security.jwt.issuer-uri=${SECURITY_JWT_ISSUER_URI:}
security.jwt.jwk-set-uri=${SECURITY_JWT_JWK_SET_URI:}
# Payment authorization step (saga). Disabled by default: enabling it requires a
# PaymentGateway bean (a PSP adapter). Card data never enters these services.
payments.enabled=${PAYMENTS_ENABLED:false}
payments.currency=${PAYMENTS_CURRENCY:INR}
# Prices are always read server-side from the catalog.
catalog.service.url=${CATALOG_SERVICE_URL:http://catalog-service:8081}
# Versioned schema migrations. Migrations own the schema; Hibernate only
# validates it. baseline-on-migrate covers databases created from the older
# database/*-init.sql scripts.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
