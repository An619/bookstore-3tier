spring.application.name=orders-service
server.port=${SERVER_PORT:8082}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://orders-service-postgres:5432/ordersdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:serviceuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:local-only-change-me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db

# Inventory service used by server-side checkout.
inventory.service.url=${INVENTORY_SERVICE_URL:http://inventory-service:8083}
