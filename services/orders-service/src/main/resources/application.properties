spring.application.name=orders-service
server.port=${SERVER_PORT:8082}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://orders-service-database:5432/ordersservice}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:serviceuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:local-only-change-me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
