apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookstore-inventory-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/An619/bookstore-3tier.git
    targetRevision: main
    path: helm/inventory-service
    helm:
      releaseName: inventory-service
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: bookstore
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
