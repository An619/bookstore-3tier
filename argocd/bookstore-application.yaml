apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookstore-frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/An619/bookstore-3tier.git
    targetRevision: main
    path: helm/frontend
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: bookstore
  # Deliberately manual until image tags, ingress and cluster access are reviewed.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
