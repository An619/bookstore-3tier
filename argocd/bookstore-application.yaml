apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookstore
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/An619/bookstore-3tier.git
    targetRevision: feature/devops-platform-foundation
    path: helm/bookstore
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: bookstore
  # Deliberately manual until image tags, secrets, ingress and cluster access are reviewed.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
