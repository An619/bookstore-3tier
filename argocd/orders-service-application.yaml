apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookstore-orders-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/An619/bookstore-3tier.git
    targetRevision: feature/devops-platform-foundation
    path: helm/orders-service
  destination:
    server: https://kubernetes.default.svc
    namespace: bookstore
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
