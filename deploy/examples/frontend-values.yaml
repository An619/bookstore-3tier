# EXAMPLE ONLY: change DNS name, TLS secret and ingress class before using.
ingress:
  enabled: true
  className: nginx
  host: bookstore.example.com
  tls:
    - secretName: bookstore-tls
      hosts: [bookstore.example.com]
networkPolicy:
  enabled: true
