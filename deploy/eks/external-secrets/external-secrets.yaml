# One ExternalSecret per database. The synced Secret names are exactly what the
# charts expect (database.existingSecret / database.secretName).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: catalog-db
  namespace: bookstore
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: catalog-db-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: bookstore/lab/catalog-db
