# gp3 volumes for the bundled PostgreSQL StatefulSets on EKS. Requires the EBS
# CSI driver add-on (created by terraform/eks) with its IAM role.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    # Lab default. If another default StorageClass already exists, remove this
    # annotation and set database.storageClassName in the charts instead.
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
