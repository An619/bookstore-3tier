# OPTIONAL - not used by the default deployment path.
# Only apply this if you enabled EBS in Terraform (enable_ebs_csi = true). The
# default path runs the databases with ephemeral storage (no EBS, data lost on
# pod restart) or against an external database.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
