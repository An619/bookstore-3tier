kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bookstore-lab
nodes:
  - role: control-plane
    # Host ports are used only for an optional ingress controller.
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
