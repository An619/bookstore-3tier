# LAB ONLY: automated sync is enabled so a disposable kind cluster converges
# without extra CLI steps. Do not reuse this file for shared/production clusters.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookstore-catalog-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/An619/bookstore-3tier.git
    targetRevision: TARGET_REVISION
    path: helm/catalog-service
    helm:
      releaseName: catalog-service
      valueFiles: [values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: bookstore
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
