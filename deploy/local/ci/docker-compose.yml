# LAB ONLY. Do not expose these services to the Internet or reuse this
# configuration for production; the Jenkins controller has host Docker access.
name: bookstore-ci-lab
services:
  jenkins:
    build: .
    ports:
      - "8085:8080"
      - "50000:50000"
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      JAVA_OPTS: -Djenkins.install.runSetupWizard=true
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    # Set DOCKER_GID=$(stat -c %g /var/run/docker.sock) in deploy/local/ci/.env
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID in deploy/local/ci/.env}"
    depends_on:
      sonarqube:
        condition: service_started

  sonarqube:
    # Pin a digested SonarQube image for any use beyond a disposable lab.
    image: sonarqube:lts-community
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-lab-sonar-password-change-me}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
    depends_on:
      sonar-db:
        condition: service_healthy

  sonar-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-lab-sonar-password-change-me}
    volumes:
      - sonar-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  jenkins-home:
  sonar-data:
  sonar-extensions:
  sonar-db:
