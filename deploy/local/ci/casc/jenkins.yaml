# Jenkins Configuration as Code for the LOCAL LAB only. Every ${...} value is
# provided by deploy/local/ci/lab.sh through the container environment.
jenkins:
  systemMessage: "Bookstore local CI lab - disposable, not for production"
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
unclassified:
  location:
    url: "${JENKINS_URL}"
    adminAddress: "local-lab@example.invalid"
  sonarGlobalConfiguration:
    buildWrapperEnabled: false
    installations:
      - name: "SonarQube"
        serverUrl: "${SONAR_HOST_URL}"
        credentialsId: "sonarqube-token"
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonarqube-token"
              description: "SonarQube token created by deploy/local/ci/lab.sh"
              secret: "${SONAR_TOKEN}"
